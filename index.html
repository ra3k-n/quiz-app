<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مسابقة الحروف">
<meta name="mobile-web-app-capable" content="yes">
<title>مسابقة الحروف</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%230b1220'/%3E%3Ctext x='96' y='135' font-size='120' font-weight='900' text-anchor='middle' fill='%23fbbf24' font-family='sans-serif'%3Eأ%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%230b1220'/%3E%3Ctext x='96' y='135' font-size='120' font-weight='900' text-anchor='middle' fill='%23fbbf24' font-family='sans-serif'%3Eأ%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1220; --bg2:#0f172a; --panel:#1e293b; --panel2:#172033;
  --line:#334155; --txt:#e5eaf3; --muted:#94a3b8;
  --gold:#fbbf24; --gold2:#f59e0b; --ok:#22c55e;
  --bgGlow:#1e3a8a22;
  --iconStroke:#e5eaf3;
}
body.light{
  --bg:#f1f5f9; --bg2:#e2e8f0; --panel:#ffffff; --panel2:#f8fafc;
  --line:#cbd5e1; --txt:#000000; --muted:#1e293b;
  --bgGlow:#fbbf2418;
  --iconStroke:#000000;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html,body{height:100%;overscroll-behavior:none}
body{
  font-family:'Segoe UI','Tahoma',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;
  height:100vh;height:100dvh;overflow:hidden;
  background-image:radial-gradient(900px 500px at 50% -10%,var(--bgGlow),transparent);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
  transition:background-color .3s,color .3s;
}

/* ===== شاشة القفل ===== */
#lockScreen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:16px;padding:20px;font-family:inherit;
  background-image:radial-gradient(900px 500px at 50% -10%,var(--bgGlow),transparent);
}
#lockScreen .lockIcon{
  width:80px;height:80px;border-radius:20px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:grid;place-items:center;font-size:40px;
  box-shadow:0 8px 32px #fbbf2455;
}
#lockScreen h1{font-size:44px;color:var(--gold);font-weight:900}
#lockScreen p.hint{color:var(--muted);font-size:17px;font-weight:700;text-align:center;line-height:1.6}
#lockScreen input{
  width:100%;max-width:320px;padding:14px 18px;font-size:18px;
  text-align:center;background:var(--panel);border:2px solid var(--line);
  border-radius:12px;color:var(--txt);outline:none;font-family:inherit;
  letter-spacing:6px;font-weight:700;
}
#lockScreen input:focus{border-color:var(--gold)}
#lockScreen button{
  width:100%;max-width:320px;padding:14px;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#3b2600;border:none;border-radius:12px;cursor:pointer;font-family:inherit;
  transition:.15s;
}
#lockScreen button:active{transform:scale(.97)}
#lockScreen .err{color:#ef4444;font-size:13px;height:18px;font-weight:700}
#lockScreen .copy{color:var(--muted);font-size:11px;opacity:.5;margin-top:20px}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-6px)}
  80%{transform:translateX(6px)}
}
.shake{animation:shake .35s}

/* ===== الهيدر ===== */
header{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:10px 14px;
  background:var(--bg);
  border-bottom:1px solid var(--line);
  z-index:100;
  transition:background-color .3s,border-color .3s;
}
header .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;user-select:none}
header .modelTitle{position:absolute;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:var(--gold);white-space:nowrap;pointer-events:none}
body.light header .modelTitle{color:#000}
header{position:relative}
header .icon{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  display:grid;place-items:center;font-size:20px;font-weight:900;color:#3b2600;
  box-shadow:0 4px 12px #fbbf2435;
}
header h1{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


header .theme{
  background:var(--panel);border:1px solid var(--line);color:var(--txt);
  width:38px;height:38px;border-radius:50%;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:.2s;padding:0;
}
header .theme:hover{background:var(--panel2);transform:rotate(20deg)}
header .theme:active{transform:scale(.9) rotate(20deg)}
header .theme svg{
  width:20px;height:20px;
  stroke:var(--iconStroke);fill:none;
  stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;
  transition:stroke .3s;
}

/* ===== المحتوى ===== */
main{flex:1;min-height:0;display:flex;flex-direction:column}

#homeScreen{overflow-y:auto;padding:16px}
#homeScreen.hide{display:none}
.intro{text-align:center;padding:4px 12px 16px}
.intro h2{font-size:24px;color:var(--gold);font-weight:800}
.grid{
  display:grid;gap:10px;
  grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  max-width:1100px;margin:0 auto;
}
.modelCard{
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:14px;
  padding:16px 10px;text-align:center;cursor:pointer;
  transition:.18s;user-select:none;
}
.modelCard:active{transform:scale(.96)}
.modelCard:hover{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 24px #0004}
.modelCard .num{
  font-size:32px;font-weight:900;line-height:1;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.modelCard .lbl{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.modelCard .cnt{font-size:10px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}

#quizScreen{display:none;flex-direction:column;overflow:hidden;padding:6px;gap:6px;flex:1;min-height:0}
#quizScreen.active{display:flex}

.items{
  flex:1;min-height:0;
  display:grid;grid-template-rows:repeat(4,1fr);
  gap:5px;
}
.item{
  display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:12px;
  padding:6px 10px;min-height:0;overflow:hidden;
  transition:border-color .2s,background .2s;
}
.item.revealed{
  border-color:var(--ok);
  background:linear-gradient(180deg,#14532d22,var(--panel2));
}
body.light .item.revealed{
  background:linear-gradient(180deg,#dcfce7,var(--panel2));
}

.letter{
  width:44px;height:44px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#3b2600;border-radius:11px;
  display:grid;place-items:center;
  font-size:20px;font-weight:900;
  box-shadow:0 3px 10px #fbbf2425;
}

.qgroup{
  flex:1;min-width:0;
  display:flex;align-items:center;justify-content:center;
  gap:10px;overflow:hidden;flex-wrap:wrap;
}
.q{
  flex:0 1 auto;min-width:0;
  white-space:normal;overflow:visible;
  text-align:center;
  font-size:24px;font-weight:800;
  line-height:1.7;padding:2px 0;
}
body.light .q{color:#000;font-weight:800}
.a{
  color:var(--ok);font-weight:800;
  padding-right:10px;
  border-right:2px solid var(--ok);
  white-space:normal;
  display:none;
  font-size:20px;line-height:1.7;
}
.item.revealed .a{display:inline-block}

.revealBtn{
  background:var(--ok);border:none;color:#04220f;
  padding:8px 14px;border-radius:9px;cursor:pointer;
  font-size:12px;font-weight:800;font-family:inherit;
  flex-shrink:0;min-width:62px;
  transition:.15s;
}
.revealBtn:active{transform:scale(.94)}
.revealBtn.done{background:var(--line);color:var(--muted)}

.bottomBar{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:8px 14px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  flex-wrap:wrap;
  transition:background-color .3s,border-color .3s;
}
.bottomBar .info{font-size:13px;color:var(--muted);font-weight:600}
.bottomBar .info b{color:var(--gold);font-weight:800;font-size:14px}
.pages{display:flex;gap:8px}
.pageBtn{
  background:var(--bg2);border:1px solid var(--line);color:var(--txt);
  padding:9px 16px;border-radius:9px;cursor:pointer;
  font-size:13px;font-weight:700;font-family:inherit;transition:.15s;
}
.pageBtn:active:not(:disabled){transform:scale(.95)}
.pageBtn:hover:not(:disabled){border-color:var(--gold)}
.pageBtn:disabled{opacity:.3;cursor:not-allowed}

@media(max-width:600px){
  header{padding:8px 10px;gap:6px}
  header h1{font-size:15px}
  header .icon{width:34px;height:34px;font-size:16px}
  header .modelTitle{font-size:17px}
  header .icon{font-size:18px}
  header .theme{width:34px;height:34px}
  header .theme svg{width:18px;height:18px}
  #quizScreen{padding:4px;gap:4px}
  .items{gap:4px}
  .item{padding:4px 7px;gap:6px;border-radius:10px}
  .letter{width:40px;height:40px}
  .letter{width:38px;height:38px;font-size:17px;border-radius:9px}
  .q{font-size:17px}
  .a{font-size:15px;padding-right:8px}
  .revealBtn{padding:7px 10px;font-size:11px;min-width:54px;border-radius:8px}
  .bottomBar{padding:7px 10px;gap:8px}
  .bottomBar .info{font-size:11px}
  .bottomBar .info b{font-size:12px}
  .pageBtn{padding:8px 13px;font-size:12px}
  .grid{grid-template-columns:repeat(3,1fr);gap:8px}
  .modelCard{padding:12px 6px}
  .modelCard .num{font-size:26px}
  .intro h2{font-size:20px}
  #lockScreen .lockIcon{width:70px;height:70px;font-size:34px}
  #lockScreen h1{font-size:36px}
}

@media print{
  header .theme,.revealBtn,.bottomBar{display:none!important}
  .a{display:inline-block!important}
  .item{page-break-inside:avoid}
}
</style>
</head>
<body>

<!-- ============ شاشة القفل ============ -->
<div id="lockScreen">
  <h1>مسابقة الحروف</h1>
  <p class="hint">أدخل كلمة المرور</p>
  <input id="pwdInput" type="password" placeholder="••••" inputmode="numeric" autocomplete="off" maxlength="10">
  <button id="pwdBtn">دخول</button>
  <p class="err" id="pwdError"></p>
</div>

<header>
  <div class="brand" id="brandBtn" role="button" tabindex="0" aria-label="الصفحة الرئيسية">
    <div class="icon">أ</div>
    <h1 id="title">مسابقة الحروف</h1>
  </div>
  <div class="modelTitle" id="modelTitle"></div>

  <button class="theme" id="themeBtn" aria-label="تبديل المظهر">
    <svg id="iconMoon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
    <svg id="iconSun" viewBox="0 0 24 24" style="display:none">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2"  x2="12" y2="4"/>
      <line x1="12" y1="20" x2="12" y2="22"/>
      <line x1="4.93" y1="4.93"  x2="6.34" y2="6.34"/>
      <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
      <line x1="2"  y1="12" x2="4"  y2="12"/>
      <line x1="20" y1="12" x2="22" y2="12"/>
      <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/>
      <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
    </svg>
  </button>

</header>

<main>
  <section id="homeScreen">
    <div class="intro"><h2>اختر النموذج للبدء</h2></div>
    <div class="grid" id="modelsGrid"></div>
  </section>

  <section id="quizScreen">
    <div class="items" id="itemsBox"></div>
    <div class="bottomBar">
      <div class="info" id="pageInfo"></div>
      <div class="pages">
        <button class="pageBtn" id="prevBtn">◀ السابق</button>
        <button class="pageBtn" id="nextBtn">التالي ▶</button>
      </div>
    </div>
  </section>
</main>

<script>
/* =========================================================
   شاشة القفل — كلمة المرور: 3302
   يطلبها في كل مرة (حتى مع تحديث الصفحة)
   ========================================================= */
(function lockApp(){
  const PASSWORD = '3302';

  const $lock = document.getElementById('lockScreen');
  const $pwd  = document.getElementById('pwdInput');
  const $btn  = document.getElementById('pwdBtn');
  const $err  = document.getElementById('pwdError');

  document.body.style.overflow = 'hidden';

  function tryUnlock(){
    const v = $pwd.value.trim();
    if(v === PASSWORD){
      $lock.style.display = 'none';
      document.body.style.overflow = '';
    } else {
      $err.textContent = '❌ كلمة المرور غير صحيحة';
      $pwd.value = '';
      $pwd.focus();
      $lock.classList.add('shake');
      setTimeout(() => $lock.classList.remove('shake'), 400);
    }
  }

  $btn.addEventListener('click', tryUnlock);
  $pwd.addEventListener('keydown', e => { if(e.key === 'Enter') tryUnlock(); });
  setTimeout(() => $pwd.focus(), 200);
})();

/* =========================================================
   البيانات — 18 نموذج × 28 حرفاً (أ → ي)
   ========================================================= */
const MODELS = [
/* 1 */
[["أ","تسمى بالقارة العجوز","أوروبا"],["ب","سورة في القرآن تسمى سنام القرآن","البقرة"],["ت","تفريق المال على وجه الإسراف","تبذير"],["ث","من فقدت ولدها تسمى","ثكلى"],["ج","شعور يدفعك للأكل","جوع"],["ح","عم الرسول صلى الله عليه وسلم","حمزة بن عبدالمطلب"],["خ","أول من أسلمت من النساء","خديجة"],["د","صوت مشي النملة","دبيب"],["ذ","أصغر شيء في الجزيء","ذرة"],["ر","بمعنى الهادئ المتزن","رزين"],["ز","حجر كريم متعدد الألوان","زبرجد"],["س","نبي علمه الله لغة الطير","سليمان"],["ش","مشروب صيني المنشأ","شاي"],["ص","قائد المسلمين في معركة حطين","صلاح الدين"],["ض","من الحيوانات الصحراوية","ضب"],["ط","مرض يسمى الموت الأسود","طاعون"],["ظ","شيء إذا سرتَ سار معك","ظل"],["ع","يطلق على قوم النبي هود","عاد"],["غ","من أسماء الأسد","غضنفر"],["ف","مقياس قديم من مقاييس الطول","فرسخ"],["ق","أول ولد آدم","قابيل"],["ك","ابن النبي نوح الذي غرق في الطوفان","كنعان"],["ل","من المعاجم العربية","لسان العرب"],["م","أمر خارق للعادة يجريه الله على أيدي الأنبياء","معجزة"],["ن","الحشرة التي تكلمت في القرآن","نملة"],["هـ","بين المشي والعدو","هرولة"],["و","الشق بين جبلين","وادي"],["ي","سد مأرب يوجد في","اليمن"]],
/* 2 */
[["أ","نبي سميت سورة من القرآن باسمه","إبراهيم"],["ب","أكمل المثل: على نفسها جنت ........","براقش"],["ت","ملك الحبشة قيل إنه أول من كسى الكعبة","تبع"],["ث","يطلق على المرأة التي سبق لها الزواج","ثيب"],["ج","لزم المكان فلم يبرحه","جثم"],["ح","أشهر الكرماء في التاريخ","حاتم الطائي"],["خ","بيت من الوبر أو الصوف أو الشعر يسمى","خباء"],["د","جمع كلمة ديك","ديكة أو ديوك"],["ذ","بمعنى انتشار الخبر","ذاع"],["ر","أفضل الشهور","رمضان"],["ز","المعدن الوحيد الذي يوجد في حالة سائلة","زئبق"],["س","يطلق على القطيع أو الجماعة جنباً إلى جنب","سرب"],["ش","أكمل المثل (أهل مكة أدرى بـــ ......)","شعابها"],["ص","من أمهات المؤمنين","صفية بنت حيي"],["ض","الوازع النفسي لإدراك الشر وتجنبه يسمى","ضمير"],["ط","عضو في داخل جسم الإنسان","طبلة الأذن"],["ظ","نهى الله عنه وقال إن بعضه إثم","ظن"],["ع","نبي ينسب إلى أمه دائماً في القرآن","عيسى بن مريم"],["غ","كلمة تعني غطاء","غشاء أو غشاوة"],["ف","يؤدي نقص الحديد في الجسم إلى .....","فقر الدم"],["ق","أول ما خلق الله","القلم"],["ك","قوم يستخفون في مكمن يرقبون العدو ليهاجموه في غفلة منه","كمين"],["ل","يستخرج من البحر ويباع بأغلى الأثمان","اللؤلؤ"],["م","القطار الكهربائي الذي تحت الأرض يسمى","المترو"],["ن","الدابة التي أرسلت إلى ثمود","الناقة"],["هـ","الذي أخفى من الصوت يسمى","همس"],["و","اسم الطين الخفيف","وحل"],["ي","شجرة أنبتها الله لنبي الله يونس عليه السلام","اليقطين"]],
/* 3 */

    $iconSun.style.display  = 'block';
    $iconMoon.style.display = 'none';
    document.querySelector('meta[name=theme-color]').setAttribute('content','#f1f5f9');
  } else {
    document.body.classList.remove('light');
    $iconSun.style.display  = 'none';
    $iconMoon.style.display = 'block';
    document.querySelector('meta[name=theme-color]').setAttribute('content','#0b1220');
  }
}
(function initTheme(){
  applyTheme('light');
})();
$theme.addEventListener('click', () => {
  applyTheme(document.body.classList.contains('light') ? 'dark' : 'light');
});

/* ============ بناء الصفحة الرئيسية ============ */
(function buildHome(){
  const frag = document.createDocumentFragment();
  MODELS.forEach((m, i) => {
    const d = document.createElement('div');
    d.className = 'modelCard';
    d.innerHTML = `<div class="num">${i+1}</div>
      <div class="lbl">النموذج</div>
      <div class="cnt">${m.length} حرفاً</div>`;
    d.addEventListener('click', () => openModel(i));
    frag.appendChild(d);
  });
  $grid.appendChild(frag);
})();

function openModel(idx){
  currentModel = idx;
  currentPage = 0;
  $home.classList.add('hide');
  $quiz.classList.add('active');
  $mtitle.textContent = `النموذج ${idx+1}`;
  renderPage();
  window.scrollTo(0,0);
}

function closeModel(){
  $home.classList.remove('hide');
  $quiz.classList.remove('active');
  $mtitle.textContent = '';
  window.scrollTo(0,0);
}

/* ============ عرض الصفحة ============ */
function renderPage(){
  const items = MODELS[currentModel];
  const totalPages = Math.ceil(items.length / PER_PAGE);
  const start = currentPage * PER_PAGE;
  const end = Math.min(start + PER_PAGE, items.length);
  const slice = items.slice(start, end);

  $items.innerHTML = '';
  const frag = document.createDocumentFragment();

  slice.forEach(([letter, question, answer]) => {
    const card = document.createElement('div');
    card.className = 'item';

    const letterEl = document.createElement('div');
    letterEl.className = 'letter';
    letterEl.textContent = letter;

    const group = document.createElement('div');
    group.className = 'qgroup';

    const q = document.createElement('span');
    q.className = 'q';
    q.textContent = question;

    const a = document.createElement('span');
    a.className = 'a';
    a.textContent = answer;

    group.appendChild(q);
    group.appendChild(a);

    const btn = document.createElement('button');
    btn.className = 'revealBtn';
    btn.textContent = 'إظهار';
    btn.addEventListener('click', () => {
      card.classList.toggle('revealed');
      const on = card.classList.contains('revealed');
      btn.textContent = on ? 'إخفاء' : 'إظهار';
      btn.classList.toggle('done', on);
      fitItem(card);
    });

    card.appendChild(letterEl);
    card.appendChild(group);
    card.appendChild(btn);
    frag.appendChild(card);
  });

  $items.appendChild(frag);

  $pageInfo.innerHTML = `الصفحة <b>${currentPage+1}</b> من <b>${totalPages}</b> &nbsp;•&nbsp; الحروف <b>${start+1}-${end}</b> من <b>${items.length}</b>`;

  $prev.disabled = currentPage === 0;
  $next.disabled = currentPage >= totalPages - 1;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => fitAllItems());
  });
}

/* ============ ضبط حجم الخط ============ */
function fitItem(item){
  const q    = item.querySelector('.q');
  const a    = item.querySelector('.a');
  const wrap = item.querySelector('.qgroup');
  if(!q || !wrap) return;
  const mobile = window.innerWidth <= 600;
  let size = mobile ? 20 : 28;
  const apply = (s) => { q.style.fontSize = s + 'px'; a.style.fontSize = (s*0.9) + 'px'; };
  apply(size);
  const over = () => item.scrollHeight > item.clientHeight + 1 || wrap.scrollHeight > wrap.clientHeight + 1;
  let guard = 60;
  while(over() && size > 11 && guard-- > 0){ size -= 0.5; apply(size); }
}
function fitAllItems(){
  document.querySelectorAll('#itemsBox .item').forEach(fitItem);
}

/* ============ التنقل ============ */
$brand.addEventListener('click', closeModel);
$brand.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' ') closeModel(); });
$prev.addEventListener('click', () => {
  if(currentPage > 0){ currentPage--; renderPage(); window.scrollTo(0,0); }
});
$next.addEventListener('click', () => {
  const totalPages = Math.ceil(MODELS[currentModel].length / PER_PAGE);
  if(currentPage < totalPages - 1){ currentPage++; renderPage(); window.scrollTo(0,0); }
});

/* ============ اختصارات ============ */
document.addEventListener('keydown', e => {
  if(!$quiz.classList.contains('active')) return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); $prev.click(); }
  if(e.key === 'ArrowLeft'  || e.key === 'ArrowDown'){ e.preventDefault(); $next.click(); }
  if(e.key === 'Escape'){ closeModel(); }
});

/* ============ إعادة الضبط عند تغيير الحجم ============ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(fitAllItems, 120);
});
window.addEventListener('orientationchange', () => setTimeout(fitAllItems, 200));

document.addEventListener('gesturestart', e => e.preventDefault());

/* =========================================================
   PWA — للتثبيت والعمل بدون إنترنت
   ========================================================= */
if('serviceWorker' in navigator){
  const swCode = `
    const CACHE='quiz-v5';
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(res => {
          const copy = res.clone();
          caches.open(CACHE).then(c => c.put(e.request, copy));
          return res;
        }).catch(() => caches.match(e.request)))
      );
    });
  `;
  try{
    const blob = new Blob([swCode], {type:'text/javascript'});
    navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  }catch(e){}
}

(function injectManifest(){
  const icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%230b1220'/%3E%3Ctext x='256' y='360' font-size='320' font-weight='900' text-anchor='middle' fill='%23fbbf24' font-family='sans-serif'%3Eأ%3C/text%3E%3C/svg%3E";
  const manifest = {
    name:"مسابقة الحروف", short_name:"مسابقة الحروف",
    start_url:"./", display:"standalone",
    background_color:"#0b1220", theme_color:"#0b1220",
    orientation:"any", lang:"ar", dir:"rtl",
    icons:[
      {src:icon, sizes:"192x192", type:"image/svg+xml", purpose:"any"},
      {src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();
</script>
